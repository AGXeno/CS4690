<!DOCTYPE html>
<html lang="en-US" data-bs-theme="light">
  <head>
    <title>Admin Dashboard — Student Logs</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="darkreader-lock" />
    <link rel="icon" href="https://www.uvu.edu/favicon.ico" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
      onerror="this.onerror=null;this.href='/node_modules/bootstrap/dist/css/bootstrap.min.css';"
    />
    <link rel="stylesheet" href="/public/css/common.css" />
  </head>
  <body>
    <div class="container-fluid my-3">
      <!-- Header -->
      <div class="card shadow mb-3">
        <div class="card-header bg-tenant text-white brand-header">
          <div class="brand-left">
            <img id="tenantLogo" src="" alt="Logo" height="40" />
            <h1 class="h4 mb-0">Admin Dashboard</h1>
            <span class="badge bg-light text-dark tenant-badge" id="tenantBadge"></span>
          </div>
          <div class="d-flex gap-2">
            <span class="text-white-50 align-self-center small" id="welcomeMsg"></span>
            <button class="btn btn-outline-light btn-sm" id="themeToggle">🌙 Dark Mode</button>
            <button class="btn btn-outline-light btn-sm" id="logoutBtn" data-cy="logout">Logout</button>
          </div>
        </div>
      </div>

      <div class="row">
        <!-- Sidebar -->
        <div class="col-md-3 col-lg-2">
          <nav class="sidebar-nav">
            <a class="nav-link active" href="#" data-section="courses">Courses</a>
            <a class="nav-link" href="#" data-section="users">Users</a>
            <a class="nav-link" href="#" data-section="logs">Logs</a>
            <a class="nav-link" href="#" data-section="create-user">Create User</a>
            <a class="nav-link" href="#" data-section="create-course">Create Course</a>
          </nav>
        </div>

        <!-- Main content -->
        <div class="col-md-9 col-lg-10">
          <!-- Courses Section -->
          <div class="dashboard-section active" id="section-courses">
            <h4>All Courses</h4>
            <div id="coursesList" class="row g-3"></div>
          </div>

          <!-- Users Section -->
          <div class="dashboard-section" id="section-users">
            <h4>All Users</h4>
            <div class="mb-3">
              <select class="form-select form-select-sm w-auto" id="filterRole">
                <option value="">All roles</option>
                <option value="admin">Admins</option>
                <option value="teacher">Teachers</option>
                <option value="student">Students</option>
              </select>
            </div>
            <div id="usersList" class="table-responsive">
              <table class="table table-striped">
                <thead>
                  <tr>
                    <th>Username</th>
                    <th>Role</th>
                    <th>Courses</th>
                  </tr>
                </thead>
                <tbody id="usersTableBody"></tbody>
              </table>
            </div>
          </div>

          <!-- Logs Section -->
          <div class="dashboard-section" id="section-logs">
            <h4>All Logs</h4>
            <div class="row g-2 mb-3">
              <div class="col-auto">
                <select class="form-select form-select-sm" id="logCourseFilter">
                  <option value="">All courses</option>
                </select>
              </div>
              <div class="col-auto">
                <input type="text" class="form-control form-control-sm" id="logUvuIdFilter"
                  placeholder="Filter by Student ID" maxlength="8" />
              </div>
              <div class="col-auto">
                <button class="btn btn-sm btn-tenant" id="filterLogsBtn">Filter</button>
              </div>
            </div>
            <div id="logsDisplay"></div>
          </div>

          <!-- Create User Section -->
          <div class="dashboard-section" id="section-create-user">
            <h4>Create User</h4>
            <div id="createUserAlert" class="alert d-none" role="alert"></div>
            <form id="createUserForm" class="card card-body" style="max-width: 500px;">
              <div class="mb-3">
                <label for="newUsername" class="form-label">Username</label>
                <input type="text" class="form-control" id="newUsername" data-cy="new_username" required />
              </div>
              <div class="mb-3">
                <label for="newPassword" class="form-label">Password</label>
                <input type="password" class="form-control" id="newPassword" data-cy="new_password" required />
              </div>
              <div class="mb-3">
                <label for="newRole" class="form-label">Role</label>
                <select class="form-select" id="newRole" data-cy="new_role">
                  <option value="student">Student</option>
                  <option value="teacher">Teacher</option>
                  <option value="admin">Admin</option>
                </select>
              </div>
              <button type="submit" class="btn btn-tenant" data-cy="create_user_btn">Create User</button>
            </form>
          </div>

          <!-- Create Course Section -->
          <div class="dashboard-section" id="section-create-course">
            <h4>Create Course</h4>
            <div id="createCourseAlert" class="alert d-none" role="alert"></div>
            <form id="createCourseForm" class="card card-body" style="max-width: 500px;">
              <div class="mb-3">
                <label for="newCourseId" class="form-label">Course ID</label>
                <input type="text" class="form-control" id="newCourseId" data-cy="newCourseId"
                  placeholder="e.g. cs1400" required />
              </div>
              <div class="mb-3">
                <label for="newCourseDisplay" class="form-label">Course Name</label>
                <input type="text" class="form-control" id="newCourseDisplay" data-cy="newCourseDisplay"
                  placeholder="e.g. CS 1400" required />
              </div>
              <button type="submit" class="btn btn-tenant" data-cy="create_course_btn">Create Course</button>
            </form>
          </div>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/jquery@3.7.1/dist/jquery.min.js"></script>
    <script>
      window.jQuery ||
        document.write('<script src="/node_modules/jquery/dist/jquery.min.js"><\/script>');
    </script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
      typeof bootstrap === 'undefined' &&
        document.write('<script src="/node_modules/bootstrap/dist/js/bootstrap.bundle.min.js"><\/script>');
    </script>
    <script src="/public/js/common.js"></script>
    <script src="/public/js/admin.js"></script>
  </body>
</html>
