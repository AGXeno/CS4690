<!DOCTYPE html>
<html lang="en-US" data-bs-theme="light">
  <head>
    <title>Login — Student Logs</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="darkreader-lock" />
    <link rel="icon" href="https://www.uvu.edu/favicon.ico" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
      onerror="this.onerror=null;this.href='/node_modules/bootstrap/dist/css/bootstrap.min.css';"
    />
    <link rel="stylesheet" href="/public/css/common.css" />
  </head>
  <body>
    <div class="login-container">
      <div class="card shadow">
        <div class="card-header bg-tenant text-white brand-header">
          <div class="brand-left">
            <img id="tenantLogo" src="" alt="Logo" height="40" />
            <h1 class="h4 mb-0">Student Logs</h1>
          </div>
          <button
            type="button"
            class="btn btn-outline-light btn-sm"
            id="themeToggle"
          >
            🌙 Dark Mode
          </button>
        </div>

        <div class="card-body">
          <h5 class="card-title mb-1" id="tenantName"></h5>
          <p class="text-muted small mb-3">
            <span id="formModeLabel">Sign in to your account</span>
          </p>

          <div id="alertBox" class="alert d-none" role="alert"></div>

          <form id="authForm">
            <div class="mb-3">
              <label for="username" class="form-label">Username</label>
              <input
                type="text"
                class="form-control"
                id="username"
                data-cy="username"
                required
                autocomplete="username"
              />
            </div>
            <div class="mb-3">
              <label for="password" class="form-label">Password</label>
              <input
                type="password"
                class="form-control"
                id="password"
                data-cy="password"
                required
                autocomplete="current-password"
              />
            </div>

            <!-- Role selector (only visible during signup) -->
            <div class="mb-3 d-none" id="roleGroup">
              <label for="role" class="form-label">I am a…</label>
              <select class="form-select" id="role" data-cy="role">
                <option value="student">Student</option>
                <option value="teacher">Teacher</option>
              </select>
            </div>

            <button type="submit" class="btn btn-tenant w-100" data-cy="submit_btn">
              Sign In
            </button>
          </form>

          <hr />
          <p class="text-center mb-0 small">
            <a href="#" id="toggleMode" data-cy="toggle_mode">
              Don't have an account? Sign up
            </a>
          </p>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/jquery@3.7.1/dist/jquery.min.js"></script>
    <script>
      window.jQuery ||
        document.write(
          '<script src="/node_modules/jquery/dist/jquery.min.js"><\/script>'
        );
    </script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
      typeof bootstrap === 'undefined' &&
        document.write(
          '<script src="/node_modules/bootstrap/dist/js/bootstrap.bundle.min.js"><\/script>'
        );
    </script>
    <script src="/public/js/common.js"></script>
    <script src="/public/js/login.js"></script>
  </body>
</html>
