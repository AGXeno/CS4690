<!DOCTYPE html>
<html lang="en-US" data-bs-theme="light">
  <head>
    <title>Student Dashboard — Student Logs</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="darkreader-lock" />
    <link rel="icon" href="https://www.uvu.edu/favicon.ico" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
      onerror="this.onerror=null;this.href='/node_modules/bootstrap/dist/css/bootstrap.min.css';"
    />
    <link rel="stylesheet" href="/public/css/common.css" />
  </head>
  <body>
    <div class="container-fluid my-3">
      <!-- Header -->
      <div class="card shadow mb-3">
        <div class="card-header bg-tenant text-white brand-header">
          <div class="brand-left">
            <img id="tenantLogo" src="" alt="Logo" height="40" />
            <h1 class="h4 mb-0">Student Dashboard</h1>
            <span class="badge bg-light text-dark tenant-badge" id="tenantBadge"></span>
          </div>
          <div class="d-flex gap-2">
            <span class="text-white-50 align-self-center small" id="welcomeMsg"></span>
            <button class="btn btn-outline-light btn-sm" id="themeToggle">🌙 Dark Mode</button>
            <button class="btn btn-outline-light btn-sm" id="logoutBtn" data-cy="logout">Logout</button>
          </div>
        </div>
      </div>

      <div class="row">
        <!-- Sidebar -->
        <div class="col-md-3 col-lg-2">
          <nav class="sidebar-nav">
            <a class="nav-link active" href="#" data-section="my-courses">My Courses</a>
            <a class="nav-link" href="#" data-section="join-course">Join a Course</a>
            <a class="nav-link" href="#" data-section="logs">My Logs</a>
          </nav>
        </div>

        <!-- Main content -->
        <div class="col-md-9 col-lg-10">
          <!-- My Courses -->
          <div class="dashboard-section active" id="section-my-courses">
            <h4>My Courses</h4>
            <div id="myCoursesList" class="row g-3"></div>
          </div>

          <!-- Join Course -->
          <div class="dashboard-section" id="section-join-course">
            <h4>Join a Course</h4>
            <div id="joinCourseAlert" class="alert d-none" role="alert"></div>
            <div id="availableCourses" class="row g-3"></div>
          </div>

          <!-- My Logs -->
          <div class="dashboard-section" id="section-logs">
            <h4>My Logs</h4>

            <div class="row g-2 mb-3 align-items-end">
              <div class="col-sm-6 col-md-4">
                <label for="logCourseFilter" class="form-label small text-muted mb-1">Filter by course</label>
                <select class="form-select form-select-sm" id="logCourseFilter">
                  <option value="">All my courses</option>
                </select>
              </div>
            </div>
            <div id="logsDisplay" class="mb-4"></div>

            <!-- Add Log form (always visible) -->
            <form id="addLogForm" class="border-top pt-3" style="max-width: 600px;">
              <h5 class="mb-3">Add a New Log</h5>
              <div class="mb-3">
                <label for="newLogCourse" class="form-label">Course</label>
                <select class="form-select" id="newLogCourse" data-cy="newLogCourse"></select>
              </div>
              <div class="mb-3">
                <label for="newLogText" class="form-label">Log Entry</label>
                <textarea class="form-control" id="newLogText" data-cy="newLogText" rows="3"
                  placeholder="Write your log here…"></textarea>
              </div>
              <button type="submit" class="btn btn-tenant" data-cy="add_log_btn" disabled>Add Log</button>
            </form>
          </div>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/jquery@3.7.1/dist/jquery.min.js"></script>
    <script>
      window.jQuery ||
        document.write('<script src="/node_modules/jquery/dist/jquery.min.js"><\/script>');
    </script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
      typeof bootstrap === 'undefined' &&
        document.write('<script src="/node_modules/bootstrap/dist/js/bootstrap.bundle.min.js"><\/script>');
    </script>
    <script src="/public/js/common.js"></script>
    <script src="/public/js/student.js"></script>
  </body>
</html>
