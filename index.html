<!DOCTYPE html>
<html lang="en-US" data-bs-theme="light">
  <head>
    <title>Student Logs</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" href="https://www.uvu.edu/favicon.ico" />

    <!-- Bootstrap CSS: CDN with local fallback -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
      onerror="this.onerror=null;this.href='node_modules/bootstrap/dist/css/bootstrap.min.css';"
    />

    <!-- Extra Credit: UVU official green override -->
    <style>
      :root,
      [data-bs-theme='light'] {
        --bs-success: #275d38;
        --bs-success-rgb: 39, 93, 56;
      }
      [data-bs-theme='dark'] {
        --bs-success: #275d38;
        --bs-success-rgb: 39, 93, 56;
      }
    </style>
  </head>
  <body>
    <div class="container my-4">
      <div class="card shadow">
        <!-- Header with UVU branding and theme toggle -->
        <div
          class="card-header bg-success text-white d-flex justify-content-between align-items-center flex-wrap gap-2"
        >
          <div class="d-flex align-items-center gap-3">
            <img
              src="https://www.uvu.edu/_common/images/uvu-mono.svg"
              alt="UVU Logo"
              height="40"
            />
            <h1 class="h4 mb-0">Student Logs</h1>
          </div>
          <!-- Extra Credit: Light/Dark mode toggle -->
          <button
            type="button"
            class="btn btn-outline-light btn-sm"
            data-cy="theme_toggle"
            id="themeToggle"
          >
            🌙 Dark Mode
          </button>
        </div>

        <div class="card-body">
          <!-- UVU ID input + course selector row -->
          <div class="row g-3 mb-3">
            <div class="col-md-4">
              <label for="uvuId" class="form-label">UVU ID</label>
              <input
                type="text"
                class="form-control"
                id="uvuId"
                data-cy="uvuId"
                placeholder="Enter UVU ID"
                maxlength="8"
              />
              <div class="form-text" id="uvuIdError"></div>
            </div>
            <div class="col-md-4">
              <label for="course" class="form-label">Course</label>
              <select
                class="form-select"
                id="course"
                data-cy="course"
                disabled
              >
                <option value="">Select a course…</option>
              </select>
            </div>
          </div>

          <!-- Add Course form -->
          <form id="addCourseForm" class="border-top pt-3 mb-3">
            <h5 class="mb-3">Add a New Course</h5>
            <div class="row g-3 align-items-end">
              <div class="col-md-3">
                <label for="newCourseId" class="form-label">Course ID</label>
                <input
                  type="text"
                  class="form-control"
                  id="newCourseId"
                  data-cy="newCourseId"
                  placeholder="e.g. cs1400"
                />
              </div>
              <div class="col-md-4">
                <label for="newCourseDisplay" class="form-label">Course Name</label>
                <input
                  type="text"
                  class="form-control"
                  id="newCourseDisplay"
                  data-cy="newCourseDisplay"
                  placeholder="e.g. CS 1400"
                />
              </div>
              <div class="col-md-3">
                <button
                  type="submit"
                  class="btn btn-success"
                  data-cy="add_course_btn"
                  disabled
                >
                  Add Course
                </button>
              </div>
            </div>
          </form>

          <!-- Logs display area -->
          <div id="logs" data-cy="logs" class="mb-4"></div>

          <!-- Add Log form -->
          <form id="addLogForm" class="border-top pt-3" style="display:none;">
            <h5 class="mb-3">Add a New Log</h5>
            <div class="d-flex flex-column gap-3">
              <div>
                <label for="newLogCourse" class="form-label">Course</label>
                <select
                  class="form-select"
                  id="newLogCourse"
                  data-cy="newLogCourse"
                  disabled
                >
                  <option value="">Select a course…</option>
                </select>
              </div>
              <div>
                <label for="newLogUvuId" class="form-label">UVU ID</label>
                <input
                  type="text"
                  class="form-control"
                  id="newLogUvuId"
                  data-cy="newLogUvuId"
                  readonly
                />
              </div>
              <div>
                <label for="newLogText" class="form-label">Log Entry</label>
                <textarea
                  class="form-control"
                  id="newLogText"
                  data-cy="newLogText"
                  rows="3"
                  placeholder="Write your log here…"
                ></textarea>
              </div>
              <button
                type="submit"
                class="btn btn-success"
                data-cy="add_log_btn"
                disabled
              >
                Add Log
              </button>
            </div>
          </form>
        </div>
      </div>
    </div>

    <!-- jQuery: CDN with local fallback -->
    <script src="https://cdn.jsdelivr.net/npm/jquery@3.7.1/dist/jquery.min.js"></script>
    <script>
      window.jQuery ||
        document.write(
          '<script src="node_modules/jquery/dist/jquery.min.js"><\/script>'
        );
    </script>

    <!-- Bootstrap JS: CDN with local fallback -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
      typeof bootstrap === 'undefined' &&
        document.write(
          '<script src="node_modules/bootstrap/dist/js/bootstrap.bundle.min.js"><\/script>'
        );
    </script>

    <!-- App script (compiled from TypeScript) -->
    <script src="script.js"></script>
  </body>
</html>
